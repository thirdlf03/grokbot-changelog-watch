name: Watch Grok Bot changelog

on:
  schedule:
    # Every 6 hours at :17 UTC (weekdays and weekends)
    - cron: "17 0,6,12,18 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Print payloads only; do not POST or update state"
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check changelog
        id: check
        env:
          GROKBOT_WEBHOOK_URL: ${{ secrets.GROKBOT_WEBHOOK_URL }}
          GROKBOT_WEBHOOK_KEY: ${{ secrets.GROKBOT_WEBHOOK_KEY }}
        run: |
          set -euo pipefail
          DRY="${{ github.event_name == 'workflow_dispatch' && inputs.dry_run || false }}"
          EXTRA=()
          if [ "$DRY" = "true" ]; then
            EXTRA+=(--dry-run)
          fi
          python3 scripts/check_changelog.py "${EXTRA[@]}"

      - name: Commit state if changed
        if: github.event_name != 'workflow_dispatch' || inputs.dry_run != true
        run: |
          set -euo pipefail
          if git diff --quiet -- state/last_seen.json; then
            echo "State unchanged; no commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state/last_seen.json
          git commit -m "chore(state): advance last seen Grok Bot release"
          git push
